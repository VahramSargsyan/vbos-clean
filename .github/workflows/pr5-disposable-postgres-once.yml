# Owner-authorized second run: same exact PR #5 source, two separate disposable databases.
# CI branch only; no deployment, cloud data access, cache or persisted artifacts.
name: PR5 disposable PostgreSQL E2E
on:
  push:
    branches:
      - ci/pr5-disposable-postgres-once-20261116
    paths:
      - .github/workflows/pr5-disposable-postgres-once.yml
permissions:
  contents: read
jobs:
  isolated-postgres-e2e:
    name: Exact-source full E2E with separated synthetic Finance database
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clean_ci
          POSTGRES_PASSWORD: ci_only_disposable_20261116
          POSTGRES_DB: clean_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clean_ci -d clean_ci_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://clean_ci:ci_only_disposable_20261116@127.0.0.1:5432/clean_ci_ephemeral
      FINANCE_TEST_DATABASE_URL: postgresql://clean_ci:ci_only_disposable_20261116@127.0.0.1:5432/vbos_mvp_ci
    steps:
      - name: Checkout exact approved PR #5 candidate
        uses: actions/checkout@v4
        with:
          ref: fe772dbef62edde1d15ba6f3066ac54bfeb4779a
          persist-credentials: false
      - name: Assert exact source and loopback-only database targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe772dbef62edde1d15ba6f3066ac54bfeb4779a"
          node -e "const a=new URL(process.env.TEST_DATABASE_URL),b=new URL(process.env.FINANCE_TEST_DATABASE_URL);if(a.hostname!=='127.0.0.1'||b.hostname!=='127.0.0.1'||a.pathname!=='/clean_ci_ephemeral'||b.pathname!=='/vbos_mvp_ci'||a.pathname===b.pathname)process.exit(3);"
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Create distinct empty Finance Pilot database on disposable local Postgres
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const clean = new URL(process.env.TEST_DATABASE_URL);
          const finance = new URL(process.env.FINANCE_TEST_DATABASE_URL);
          if (clean.hostname !== '127.0.0.1' || finance.hostname !== '127.0.0.1' ||
              clean.pathname !== '/clean_ci_ephemeral' || finance.pathname !== '/vbos_mvp_ci')
            throw new Error('CI_DISPOSABLE_DATABASE_BOUNDARY');
          const admin = new URL(clean);
          admin.pathname = '/postgres';
          const client = new pg.Client({connectionString:admin.toString(),ssl:false});
          await client.connect();
          try { await client.query('CREATE DATABASE vbos_mvp_ci'); }
          finally { await client.end(); }
          for (const [url, expected] of [[clean, 'clean_ci_ephemeral'], [finance,'vbos_mvp_ci']]) {
            const c = new pg.Client({connectionString:url.toString(),ssl:false});
            await c.connect();
            try {
              const {rows} = await c.query("SELECT current_database() AS db,(SELECT count(*)::int FROM information_schema.tables WHERE table_schema='public') AS tables");
              if (rows[0]?.db !== expected || rows[0]?.tables !== 0)
                throw new Error('CI_DATABASE_NOT_EMPTY_OR_WRONG_NAME_' + expected);
            } finally { await c.end(); }
          }
          console.log('CI_TWO_DISTINCT_EMPTY_LOOPBACK_DATABASES_PASS');
          NODE
      - name: Install canonical empty base schema for Finance E2E foreign keys
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import {readFileSync} from 'node:fs';
          const url = new URL(process.env.FINANCE_TEST_DATABASE_URL);
          if (url.hostname !== '127.0.0.1' || url.pathname !== '/vbos_mvp_ci')
            throw new Error('CI_FINANCE_BASE_SCHEMA_GUARD');
          const client = new pg.Client({connectionString:url.toString(),ssl:false});
          await client.connect();
          try {
            const migrations = [
              'schema.sql',
              'migrations/0004_schedule_manual.sql',
              'migrations/0006_worker_assignments.sql',
              'migrations/0023_crm15a_client_profile_TEST_ONLY.sql'
            ];
            for (const file of migrations) await client.query(readFileSync(file,'utf8'));
            const {rows} = await client.query(
              "SELECT to_regclass('public.mvp_clients') IS NOT NULL AS clients,"+
              "to_regclass('public.mvp_objects') IS NOT NULL AS objects,"+
              "to_regclass('public.mvp_orders') IS NOT NULL AS orders,"+
              "to_regclass('public.mvp_workers') IS NOT NULL AS workers,"+
              "(SELECT count(*)::int FROM public.mvp_clients) AS client_rows,"+
              "(SELECT count(*)::int FROM public.mvp_workers) AS worker_rows,"+
              "(SELECT count(*)::int FROM information_schema.columns WHERE table_schema='public' AND table_name='mvp_clients' AND column_name='status') AS client_status_columns");
            const z = rows[0];
            if (!z.clients || !z.objects || !z.orders || !z.workers ||
                z.client_rows !== 0 || z.worker_rows !== 0 || z.client_status_columns !== 1)
              throw new Error('CI_FINANCE_FOREIGN_KEY_BASELINE_UNVERIFIED');
            console.log('CI_FINANCE_CANONICAL_EMPTY_FK_BASELINE_PASS');
          } finally { await client.end(); }
          NODE
      - name: Source layout preflight
        run: npm run verify:source
      - name: Existing full unit/UI regression
        run: npm test
      - name: Execute all 10 canonical test:e2e commands with isolated DB routing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const expected = [
            'node tests/e2e.mjs',
            'node tests/business-monthly-gains.db.e2e.mjs',
            'node --test tests/finance-native-posting-pg.e2e.mjs',
            'node --test tests/finance-linked-investment-pg.e2e.mjs',
            'node --test tests/finance-native-cutover-pg.e2e.mjs',
            'node --test tests/finance-native-writer-pg.e2e.mjs',
            'node --test tests/finance-owner-gateway-pg.e2e.mjs',
            'node --test tests/finance-b14-crud-pg.e2e.mjs',
            'node tests/estimator-cards.pg.e2e.mjs',
            'node tests/estimator-pricebook.pg.e2e.mjs'
          ];
          const actual = JSON.parse(readFileSync('package.json','utf8')).scripts['test:e2e'].split(' && ');
          if (actual.length !== expected.length || actual.some((c,i) => c !== expected[i]))
            throw new Error('CI_E2E_SOURCE_COMMAND_LIST_DRIFT');
          let count = 0;
          for (const command of actual) {
            const isolatedFinance = command.startsWith('node --test tests/finance-');
            const target = isolatedFinance ? process.env.FINANCE_TEST_DATABASE_URL : process.env.TEST_DATABASE_URL;
            const url = new URL(target);
            if (url.hostname !== '127.0.0.1' ||
                url.pathname !== (isolatedFinance ? '/vbos_mvp_ci':'/clean_ci_ephemeral'))
              throw new Error('CI_DATABASE_ROUTE_GUARD');
            console.log('CI_E2E_STEP', count+1, 'of', actual.length,
              isolatedFinance ? 'FINANCE_ISOLATED_DB':'GENERAL_ISOLATED_DB', command);
            const args = command.trim().split(/\s+/);
            const done = spawnSync(args[0],args.slice(1),{
              stdio:'inherit',env:{...process.env,TEST_DATABASE_URL:target},timeout:900000
            });
            if (done.error) throw done.error;
            if (done.status !== 0) {
              console.error('CI_E2E_STEP_FAILED',count+1,'exit',done.status,'signal',done.signal);
              process.exit(done.status || 1);
            }
            count++;
          }
          console.log('CI_FULL_DECLARED_10_E2E_COMMANDS_TWO_LOCAL_DATABASES_PASS');
          NODE
