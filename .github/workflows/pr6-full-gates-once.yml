name: PR6 exact-source full Node and disposable PostgreSQL E2E (one-shot)
on:
  push:
    branches:
      - ci/pr6-e2e-once-20261118
    paths:
      - .github/workflows/pr6-full-gates-once.yml
permissions:
  contents: read
concurrency:
  group: pr6-postgresql-e2e-once
  cancel-in-progress: false
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pr6_ci
          POSTGRES_PASSWORD: pr6_ci_disposable_only
          POSTGRES_DB: vbos_mvp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr6_ci -d vbos_mvp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      TEST_DATABASE_URL: postgresql://pr6_ci:pr6_ci_disposable_only@127.0.0.1:5432/vbos_mvp_ci
      MVP_DATABASE_SSL: disable
      NODE_ENV: test
    steps:
      - name: Checkout exact PR6 source (not CI branch)
        uses: actions/checkout@v4
        with:
          ref: c3bdc0187df5165707b9b8198adb70443cdc4b26
          persist-credentials: false
      - name: Check source identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c3bdc0187df5165707b9b8198adb70443cdc4b26"
          test -z "$(git status --porcelain)"
          echo "PR6_EXACT_SHA_CHECKOUT_PASS c3bdc0187df5165707b9b8198adb70443cdc4b26"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no lockfile in this repository)
        run: npm install --no-audit --no-fund
      - name: Verify source layout
        run: npm run verify:source
      - name: Full Node unit and UI test suite
        run: npm test
      - name: Full disposable PostgreSQL E2E suite
        run: npm run test:e2e
      - name: Final run receipt
        shell: bash
        run: |
          echo "PR6_EXACT_SOURCE_NODE_AND_POSTGRES_E2E_PASS"
          git rev-parse HEAD
