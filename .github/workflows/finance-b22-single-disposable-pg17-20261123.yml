# One-shot B22 TEST qualification, expressly requested by owner on 2026-11-23.
# No secrets, private Neon/Render/Google connections, PROD, DB migrations, or service deploys.
# A single push to this exact file on the B22 branch is the only automatic trigger.
name: VBOS Clean Finance B22 one-shot Node and disposable PG17 qualification
on:
  push:
    branches:
      - feature/finance-b22-five-native-actions-20261123
    paths:
      - .github/workflows/finance-b22-single-disposable-pg17-20261123.yml
permissions:
  contents: read
concurrency:
  group: finance-b22-single-disposable-pg17-20261123
  cancel-in-progress: false
jobs:
  finance-b22:
    if: "${{ github.event.head_commit.message == 'ci(finance): one-shot source-pinned B22 PostgreSQL qualification' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: vbos_mvp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vbos_mvp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test_only_password@127.0.0.1:5432/vbos_mvp_ci
      CI: 'true'
    steps:
      - name: Checkout exact triggered B22 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned application dependency tree
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Exact-source guard and source layout / B22 syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run verify:source
          node --check domains/finance/finance-capital-view.mjs
          node --check domains/finance/finance-native-workspace-view.mjs
          node --check domains/finance/tests/finance-capital-view.test.mjs
          node --check public/app.js
          echo "FINANCE_B22_EXACT_SOURCE_SYNTAX_PASS=$GITHUB_SHA"
      - name: Scoped five-action and replay frontend tests
        run: node --test domains/finance/tests/finance-capital-view.test.mjs tests/finance-b18-workspace.test.mjs tests/finance-b20-hosted-route.test.mjs
      - name: Full Node / UI regression
        run: npm test
      - name: Full disposable PostgreSQL application E2E
        run: npm run test:e2e
      - name: Additional signed B21 source / immutable receipt E2E
        run: node --test tests/finance-b21-postfence-attestation-pg.e2e.mjs
      - name: B22 test receipt
        run: |
          echo "FINANCE_B22_DISPOSABLE_PG17_FULL_E2E_PASS_SOURCE=$GITHUB_SHA"
          echo "FINANCE_B22_NO_REAL_POSTGRES_NEON_RENDER_GOOGLE_PROD_WRITES"
