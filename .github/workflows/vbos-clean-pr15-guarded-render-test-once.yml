# Owner-authorized one-shot fallback: exact-SHA deploy hook only if an EXISTING protected secret exists.
# No Render key or hook URL is logged. No prod, database, migration, main or repo-settings mutation.
name: VBOS Clean PR15 guarded exact Render TEST release
on:
  push:
    branches:
      - fix/workday-open-without-a1-20261119
    paths:
      - .github/workflows/vbos-clean-pr15-guarded-render-test-once.yml
permissions:
  contents: read
concurrency:
  group: vbos-clean-pr15-guarded-render-release
  cancel-in-progress: false
jobs:
  exact-test-release:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci(pr15): check protected exact-SHA deploy hook'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_ID: srv-dbkvfh2jnfac73a31nv0
      TESTED_SHA: 50500064fb4b9943cec488822e6d9b8623909aa5
      ROLLBACK_SHA: b4727f77fd4e452842c0fa16731a656787e40e8c
      SERVICE_URL: https://vbos-clean-mvp-2026.onrender.com
    steps:
      - name: Protected exact SHA deploy hook, HTTP/commit readback, safe rollback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {setTimeout as sleep} from 'node:timers/promises';
          const secret=process.env.RENDER_DEPLOY_HOOK_URL||'';
          const sid=process.env.RENDER_SERVICE_ID, target=process.env.TESTED_SHA;
          const baseline=process.env.ROLLBACK_SHA, hosted=process.env.SERVICE_URL;
          const fail=(code)=>{throw new Error(code)};
          if(!secret){
            console.error('BLOCKED_NO_EXISTING_RENDER_DEPLOY_HOOK_URL_GITHUB_SECRET; no deploy requested');
            process.exit(78);
          }
          const hook=new URL(secret);
          if(hook.protocol!=='https:'||hook.hostname!=='api.render.com'||
             hook.pathname!=='/deploy/'+sid||!hook.searchParams.get('key')||
             hook.searchParams.has('imgURL')||
             (hook.searchParams.has('ref')&&hook.searchParams.get('ref')!==baseline)){
             fail('BLOCKED_DEPLOY_HOOK_TARGET_OR_STRUCTURE_MISMATCH');
          }
          async function invokeCommit(sha){
            const address=new URL(hook.href);
            address.searchParams.set('ref',sha);
            const res=await fetch(address.href,{method:'POST',signal:AbortSignal.timeout(30000),
              redirect:'error'});
            if(res.status!==200)fail('RENDER_HOOK_HTTP_'+res.status+'_OUTCOME_MUST_BE_REVIEWED');
            const j=await res.json();
            const id=j.deploy?.id||j.id;
            if(!/^dep-[a-z0-9]+$/.test(String(id||'')))fail('RENDER_HOOK_UNKNOWN_DEPLOY_ID');
            return id;
          }
          console.log('EXACT_SHA_HOOK_STRUCTURE_PASS service='+sid+' target='+target);
          const deployId=await invokeCommit(target);
          console.log('EXACT_SHA_DEPLOY_REQUESTED id='+deployId+' source='+target);
          let sawTarget=false,smokeError='';
          async function get(path){
            const r=await fetch(hosted+path,{headers:{'Cache-Control':'no-cache'},
              signal:AbortSignal.timeout(25000)});
            if(!r.ok)fail('HOSTED_HTTP_'+path+'_'+r.status);
            return r;
          }
          for(let i=0;i<65;i++){
            await sleep(10000);
            try{
              const health=await (await get('/health')).json();
              if(health.commit===baseline){
                if(i%6===0)console.log('DEPLOY_NOT_LIVE_YET id='+deployId);
                continue;
              }
              if(health.commit!==target)fail('HOSTED_UNEXPECTED_SHA_'+String(health.commit).slice(0,12));
              sawTarget=true;
              if(health.ok!==true||health.database!=='PostgreSQL')fail('HOSTED_HEALTH_DB_NOT_PASS');
              const ui=await (await get('/workday-legacy-ui.js')).text();
              if(!ui.includes('Рабочий день можно открыть без A1')||
                 !ui.includes("type:'day_open'")||!ui.includes('A1 не создаётся и не изменяется')){
                 fail('HOSTED_UI_SOURCE_MISMATCH');
              }
              const mw=await (await get('/my-work.js')).text();
              if(!mw.includes('Начать рабочий день'))fail('HOSTED_MYWORK_SOURCE_MISMATCH');
              smokeError='';
              console.log('RENDER_TEST_EXACT_SHA_HTTP_SMOKE_PASS deploy='+deployId+' source='+target);
              console.log('OWNER_ANDROID_ACCEPTANCE_PENDING; NO PROD OR MERGE');
              process.exit(0);
            }catch(e){
              smokeError=e.message;
              if(sawTarget)break;
              if(i%6===0)console.log('HOSTED_PENDING_READBACK id='+deployId+' reason='+smokeError);
            }
          }
          if(sawTarget){
             console.error('POST_DEPLOY_SMOKE_FAIL '+smokeError);
             try{
               const rollback=await invokeCommit(baseline);
               console.error('EXACT_PRIOR_SOURCE_ROLLBACK_REQUESTED deploy='+rollback+' baseline='+baseline);
             }catch(e){console.error('ROLLBACK_FAILED '+e.message)}
             fail('HOSTED_TEST_UNACCEPTED_AFTER_TARGET_WENT_LIVE');
          }
          fail('DEPLOY_STATUS_UNKNOWN_AFTER_TRIGGER_INSPECT_RENDER_BEFORE_RETRY_ID='+deployId);
          NODE
