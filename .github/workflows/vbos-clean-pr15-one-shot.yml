# Single authorized PR #15 verification run. Removing this file after readback restores the PR's source tree.
# Exact runtime code checkout is pinned independently of the workflow registration commit.
name: VBOS Clean PR15 one-shot exact PostgreSQL verification
on:
  push:
    branches:
      - fix/workday-open-without-a1-20261119
    paths:
      - .github/workflows/vbos-clean-pr15-one-shot.yml
permissions:
  contents: read
concurrency:
  group: vbos-clean-pr15-one-shot-exact
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci(pr15): one-shot exact-source PostgreSQL verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vbos_mvp_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: pr15_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d vbos_mvp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PR15_SOURCE_SHA: 0c17af3b8f3b92690fe28ffcfbd4a348be834357
      TEST_DATABASE_URL: postgresql://ci:pr15_synthetic_only@127.0.0.1:5432/vbos_mvp_ci
    steps:
      - name: Checkout exact PR15 candidate
        uses: actions/checkout@v4
        with:
          ref: 0c17af3b8f3b92690fe28ffcfbd4a348be834357
          persist-credentials: false
      - name: Verify source identity and isolated DB target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PR15_SOURCE_SHA"
          test "$TEST_DATABASE_URL" = "postgresql://ci:pr15_synthetic_only@127.0.0.1:5432/vbos_mvp_ci"
      - name: Prepare Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify repository source layout
        run: npm run verify:source
      - name: Run all native Node and UI tests
        run: npm test
      - name: Run real disposable PostgreSQL E2E
        run: npm run test:e2e
