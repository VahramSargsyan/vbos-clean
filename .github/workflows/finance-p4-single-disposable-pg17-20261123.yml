# One-shot owner-approved Finance P4 synthetic test qualification, 2026-11-23.
# Exact source Node22 + local disposable PG17 only.
# Guarded by branch, workflow file path and exact commit message.
# No real Neon/Google/Render/PROD access, secrets or hosted deployment.
name: VBOS Clean Finance P4 one-shot Node and disposable PG17
on:
  push:
    branches:
      - feature/finance-p4-native-entity-results-20261123
    paths:
      - .github/workflows/finance-p4-single-disposable-pg17-20261123.yml
permissions:
  contents: read
concurrency:
  group: finance-p4-single-disposable-pg17-20261123
  cancel-in-progress: false
jobs:
  finance-p4:
    if: "github.event.head_commit.message == 'ci(finance): one-shot P4 disposable PG17 qualification'"
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_pg17_password
          POSTGRES_DB: vbos_mvp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vbos_mvp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://postgres:synthetic_pg17_password@127.0.0.1:5432/vbos_mvp_ci
    steps:
      - name: Checkout exact triggering P4 source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without npm scripts
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Verify source layout, JS syntax and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run verify:source
          node --check server.mjs
          node --check public/app.js
          node --check domains/finance/finance-native-summary-history.mjs
          node --check domains/finance/finance-native-summary-view.mjs
          node --check domains/finance/finance-p4-native-entity-results.mjs
          node --check domains/finance/finance-p4-native-entity-results-view.mjs
          node --check tests/finance-p4-native-entity-results.test.mjs
          node --check tests/finance-p4-native-entity-results-pg.e2e.mjs
          echo "FINANCE_P4_EXACT_SOURCE_STATIC_PASS=$GITHUB_SHA"
      - name: Focused Finance P4 read-only object and worker contracts
        run: node --test tests/finance-p4-native-entity-results.test.mjs
      - name: Full Node regression including B23 P1 P2 P3 and P4
        run: npm test
      - name: Full genuine disposable PostgreSQL 17 regression with P4 P1 parity
        run: npm run test:e2e
      - name: Exact source final test receipt
        shell: bash
        run: |
          echo "FINANCE_P4_FULL_DISPOSABLE_PG17_PASS_SOURCE=$GITHUB_SHA"
          echo "FINANCE_P4_NO_OCCUPIED_NEON_GOOGLE_RENDER_PROD_WRITES"
